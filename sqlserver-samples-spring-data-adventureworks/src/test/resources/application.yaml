#
# Test configuration for sqlserver-samples-spring-data-adventureworks: AdventureWorks on the SQL Server that sqlserver-samples-persistence brings up, not
# an in-memory stand-in.
#
# Start it from the sibling checkout, which owns the compose file:
#
#     ../../sqlserver-samples-persistence/compose.sh
#
# That runs onacit/mssql-sample-databases:2025-latest as the container `mssql-sample-databases`, publishes 1433, and
# loads AdventureWorks, WideWorldImporters and FutonManufacturing on start; Ctrl-C takes it down again.
#
# These are the same coordinates upstream's own integration-test persistence unit uses (`adventureworks-it`, in
# src/test/resources/META-INF/persistence.xml of ../../sqlserver-samples-persistence's
# sqlserver-samples-persistence-adventureworks); keep the two in step.
#
spring:
  datasource:
    # encrypt=true, as the driver defaults to; trustServerCertificate=true, since the container's certificate is
    # self-signed.
    url: jdbc:sqlserver://localhost:1433;encrypt=true;trustServerCertificate=true;databaseName=AdventureWorks
    # sa, as upstream's adventureworks-it unit connects; MSSQL_SA_PASSWORD of its compose.yaml.
    username: sa
    password: Passw0rd!
    # Hikari can infer this from the URL; named anyway so a missing driver on the test classpath fails as "driver not
    # found" rather than as a pool timeout.
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      # The sample data is loaded by the image and is the fixture the tests read. Nothing here may touch the schema.
      # `none` is already the default for a non-embedded datasource; spelled out because the cost of getting it wrong
      # is the database.
      ddl-auto: none
      naming:
        # The mappings name every table and column as SQL Server has it (Sales.SalesOrderDetail, SalesOrderID). Boot's
        # default physical strategy would turn those into snake case (sales_order_detail, sales_orderid); this one
        # takes them as they are, as upstream's own persistence unit does.
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        # Named rather than detected. Hibernate would otherwise pick the dialect from the JDBC metadata of a first
        # connection, and when that connection fails (no container on 1433) it throws "Unable to determine Dialect".
        # With the dialect named, a missing database fails at the first query with the driver's error itself.
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true
        highlight_sql: true
    # No web layer in these tests: a lazy association touched outside a transaction should fail loudly instead of
    # quietly opening a session to satisfy it.
    open-in-view: false
    # Deliberately not `show-sql: true`, which writes straight to System.out and would print every statement twice
    # next to the org.hibernate.SQL logger that logback-spring.xml turns on.
    show-sql: false

# Log levels live in logback-spring.xml, next to this file, not under logging.level here. Boot would lay levels set
# here over that file's; keep them in one place.
